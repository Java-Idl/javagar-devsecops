name: javagar-trivy-scan

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  trivy-scan:
    name: Trivy Container SCA Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image locally
        run: |
          docker build -t javagar-app:test app/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'javagar-app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
