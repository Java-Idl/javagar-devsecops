# .pre-commit-config.yaml – javagar-devsecops Phase 1
# Runs Checkov (IaC) and cfn-lint (CloudFormation) on every local commit.
# Blocks commits that contain:
#   - Security groups open to 0.0.0.0/0 on 22/3389
#   - S3 buckets without SSE
#   - IAM policies with Action:"*" on Resource:"*"

default_stages: [pre-commit]
fail_fast: false

repos:
  # ── cfn-lint: CloudFormation linting (infra/cfn/ only) ──────────
  # Scoped to infra/cfn/ so IAM JSON / pipeline JSON are not treated as CFN.
  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.20.1
    hooks:
      - id: cfn-lint
        name: cfn-lint (CloudFormation linting)
        files: ^infra/cfn/.*\.yaml$

  # ── Checkov: IaC security scanning (infra/ and app/ only) ───────
  # tests/bad_iac/ is intentionally insecure demo content used for
  # Validation Test 1 – it is scanned manually, not as a gate.
  - repo: local
    hooks:
      - id: checkov
        name: checkov (IaC security scan)
        language: script
        entry: checkov.bat
        args:
          - "--directory"
          - "infra"
          - "--check"
          - "CKV_AWS_19,CKV_AWS_24,CKV_AWS_25,CKV_AWS_40,CKV_AWS_107"
          - "--output"
          - "cli"
        files: \.(yaml|yml|json|tf)$
        pass_filenames: false
